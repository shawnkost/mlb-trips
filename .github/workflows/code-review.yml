name: Code Review

on:
  pull_request:
    types: [opened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'code-review' && format('-skip-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  OCR_VERSION: 1.12.13
  OCR_MODEL: claude-opus-5-5

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'opened' || github.event.label.name == 'code-review')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Open Code Review
        id: install
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          npm install -g --no-audit --no-fund "@alibaba-group/open-code-review@$OCR_VERSION"
          ocr config set provider anthropic
          ocr config set model "$OCR_MODEL"

      - name: Run Open Code Review
        id: ocr
        if: steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "missing_key=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          ocr review \
            --from "origin/$BASE_REF" \
            --to "$HEAD_SHA" \
            --background "$PR_TITLE" \
            --format json \
            --audience agent \
            > "$RUNNER_TEMP/ocr-result.json" 2> "$RUNNER_TEMP/ocr-stderr.log"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "ocr exited with $status"
          cat "$RUNNER_TEMP/ocr-stderr.log" >&2
          jq -c '{status, llm, summary, comments: (.comments | length), warnings}' "$RUNNER_TEMP/ocr-result.json" || true

      - name: Post review
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OCR_EXIT_CODE: ${{ steps.ocr.outputs.exit_code }}
          OCR_MISSING_KEY: ${{ steps.ocr.outputs.missing_key }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const tmp = process.env.RUNNER_TEMP;
            const header = `### Code review (\`${process.env.OCR_MODEL}\`)`;

            const fence = (text, lang = '') => {
              const longest = Math.max(2, ...(String(text).match(/`+/g) || []).map((m) => m.length));
              const ticks = '`'.repeat(longest + 1);
              return `${ticks}${lang}\n${String(text).replace(/\n$/, '')}\n${ticks}`;
            };

            const clip = (text) => (text.length > 60000 ? `${text.slice(0, 60000)}\n\n…truncated, see the [workflow run](${runUrl}).` : text);
            const postComment = (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: clip(body) });

            const readFile = (name) => {
              try {
                return fs.readFileSync(path.join(tmp, name), 'utf8');
              } catch {
                return '';
              }
            };

            const fail = async (reason) => {
              core.warning(`Code review failed: ${reason}`);
              await postComment(`${header}\n\n:warning: The review could not be completed: ${reason}\n\nSee the [workflow run](${runUrl}) for details. Add (or remove and re-add) the \`code-review\` label to retry.`);
            };

            let result;
            try {
              result = JSON.parse(readFile('ocr-result.json'));
            } catch {
              result = null;
            }
            if (process.env.OCR_EXIT_CODE !== '0' || !result || !Array.isArray(result.comments)) {
              const env = process.env;
              const reason =
                env.CHECKOUT_OUTCOME !== 'success' ? 'the pull request head could not be checked out.'
                : env.INSTALL_OUTCOME !== 'success' ? `\`ocr\` ${env.OCR_VERSION} could not be installed or configured.`
                : env.OCR_MISSING_KEY === 'true' ? 'the `ANTHROPIC_API_KEY` repository secret is not available to this run.'
                : !env.OCR_EXIT_CODE ? '`ocr review` did not finish (it timed out or was interrupted).'
                : env.OCR_EXIT_CODE !== '0' ? `\`ocr review\` exited with code ${env.OCR_EXIT_CODE}.`
                : 'its output could not be parsed.';
              await fail(reason);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const rightLines = new Map();
            for (const file of files) {
              const lines = new Map();
              let hunk = -1;
              let line = 0;
              for (const row of (file.patch || '').split('\n')) {
                const m = row.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (m) {
                  hunk += 1;
                  line = Number(m[1]);
                } else if (hunk >= 0 && (row.startsWith('+') || row.startsWith(' '))) {
                  lines.set(line, hunk);
                  line += 1;
                }
              }
              rightLines.set(file.filename, lines);
            }

            const inline = [];
            const general = [];
            for (const c of result.comments) {
              const lines = rightLines.get(c.path);
              const end = Number(c.end_line || c.start_line);
              const start = Number(c.start_line || end);
              const hunk = lines && lines.get(end);
              if (hunk === undefined || !Number.isInteger(start) || start > end) {
                general.push(c);
                continue;
              }
              const multi = start < end && lines.get(start) === hunk;
              if (start < end && !multi && c.suggestion_code) {
                general.push(c);
                continue;
              }
              let body = c.content || '';
              if (c.suggestion_code && c.existing_code) {
                body += `\n\n${fence(c.suggestion_code, 'suggestion')}`;
              }
              const comment = { path: c.path, line: end, side: 'RIGHT', body: clip(body) };
              if (multi) Object.assign(comment, { start_line: start, start_side: 'RIGHT' });
              inline.push(comment);
            }

            const s = result.summary || {};
            const stats = [
              `Files reviewed: ${s.files_reviewed ?? 0}`,
              `findings: ${result.comments.length}`,
              s.total_tokens ? `tokens: ${s.total_tokens}` : null,
              s.elapsed ? `elapsed: ${s.elapsed}` : null,
            ].filter(Boolean).join(' · ');
            const warnings = (result.warnings || []).map((w) => `- ${typeof w === 'string' ? w : JSON.stringify(w)}`);
            const describe = (c) => {
              const loc = c.start_line ? `${c.path}:${c.start_line}${c.end_line && c.end_line !== c.start_line ? `-${c.end_line}` : ''}` : c.path;
              let text = `- **\`${loc}\`** ${c.content || ''}`;
              if (c.suggestion_code) text += `\n\n  Suggested:\n\n${fence(c.suggestion_code).replace(/^/gm, '  ')}`;
              return text;
            };

            const sections = [header, '', `${stats} · advisory only · [run](${runUrl})`];
            if (warnings.length) sections.push('', '**Warnings**', ...warnings);

            if (result.comments.length === 0) {
              sections.push('', result.status === 'skipped'
                ? `No reviewable files changed. ${result.message || ''}`.trim()
                : ':white_check_mark: No issues found.');
              await postComment(sections.join('\n'));
              return;
            }

            if (general.length) sections.push('', '**Findings outside the diff**', '', ...general.map(describe));
            const body = sections.join('\n');
            try {
              await github.rest.pulls.createReview({
                owner, repo, pull_number: pr.number, commit_id: pr.head.sha, event: 'COMMENT', body: clip(body), comments: inline,
              });
            } catch (error) {
              core.warning(`Inline review failed (${error.message}); posting findings as a comment.`);
              const all = [header, '', `${stats} · advisory only · [run](${runUrl})`, ...(warnings.length ? ['', '**Warnings**', ...warnings] : []), '', ...result.comments.map(describe)];
              await postComment(all.join('\n'));
            }
