name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mlb
          POSTGRES_PASSWORD: mlb
          POSTGRES_DB: mlb_trips_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mlb:mlb@localhost:5432/mlb_trips_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
